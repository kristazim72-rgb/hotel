<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Stay - Maison Soleil</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/booking.css">
</head>
<body>
  <main class="main-content" style="margin-left: 0; width: 100%; display: flex; justify-content: center; align-items: center;">
    <div class="booking-container">
      <h2>Plan your escape</h2>
      <p class="subtitle">Step 1 of 3 · Select your dates and guests</p>

      <div class="form-row">
        <div class="form-group">
          <label>Check-in</label>
          <input type="date" id="checkin" class="form-control" value="2026-04-25">
        </div>
        <div class="form-group">
          <label>Check-out</label>
          <input type="date" id="checkout" class="form-control" value="2026-04-29">
        </div>
      </div>

      <div class="form-group">
        <label>Number of Guests</label>
        <select id="guests" class="form-control">
          <option value="1">1 Guest</option>
          <option value="2" selected>2 Guests</option>
          <option value="3">3 Guests</option>
          <option value="4">4 Guests</option>
        </select>
      </div>

      <div class="booking-nav">
        <a href="index.html" class="btn">Back</a>
        <button onclick="saveStep1()" class="btn btn-primary">Next: Choose Room</button>
      </div>
    </div>
  </main>

  <script src="js/booking.js"></script>
  <script>
    function saveStep1() {
      const checkin = document.getElementById('checkin').value;
      const checkout = document.getElementById('checkout').value;
      const guests = document.getElementById('guests').value;

      saveBookingData('checkin', checkin);
      saveBookingData('checkout', checkout);
      saveBookingData('guests', guests);

      window.location.href = 'rooms.html';
    }
  </script>
</body>
</html>
